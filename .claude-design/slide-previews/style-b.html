<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style B: Warm Signal</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'General Sans', sans-serif;
            background: #111118;
            color: #f0ede8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* Warm gradient orbs */
        body::before {
            content: '';
            position: absolute;
            top: 10%;
            right: 15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(ellipse, rgba(255, 140, 50, 0.1) 0%, transparent 65%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(200, 80, 255, 0.06) 0%, transparent 65%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: clamp(1.5rem, 4vw, 4rem);
            max-width: 900px;
        }

        .tag {
            display: inline-block;
            font-size: clamp(0.7rem, 1.1vw, 0.85rem);
            font-weight: 500;
            color: #ff8c32;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: clamp(1rem, 2vw, 2rem);
            opacity: 0;
            animation: fadeIn 1s 0.3s forwards;
        }

        h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: clamp(2.5rem, 7vw, 6rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: clamp(0.75rem, 2vw, 1.5rem);
            opacity: 0;
            animation: slideUp 1s 0.5s forwards;
        }

        h1 .line2 {
            display: block;
            background: linear-gradient(135deg, #ff8c32, #ff5e62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(0.9rem, 1.6vw, 1.2rem);
            color: #7e7b85;
            font-weight: 400;
            line-height: 1.5;
            max-width: 500px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 1s 0.8s forwards;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #ff8c32, #ff5e62);
            border-radius: 3px;
            margin: clamp(1.5rem, 3vw, 2.5rem) auto;
            opacity: 0;
            animation: scaleIn 0.8s 1s forwards;
        }

        .author {
            font-size: clamp(0.75rem, 1.2vw, 0.95rem);
            color: #5a5660;
            font-weight: 500;
            opacity: 0;
            animation: fadeIn 1s 1.1s forwards;
        }

        .author span {
            color: #ff8c32;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scaleX(0); }
            to { opacity: 1; transform: scaleX(1); }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="tag">Expo Event 2026</div>
        <h1>The App That<br><span class="line2">Builds Itself</span></h1>
        <p class="subtitle">Ship code from your phone. No laptop required.</p>
        <div class="divider"></div>
        <p class="author">Bruno Barbieri &middot; <span>@brunobar79</span></p>
    </div>
</body>
</html>
